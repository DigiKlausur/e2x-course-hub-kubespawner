name: Build
on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions with twine
        run: twine check --strict dist/*

      # Install from the built wheel rather than the source tree, so a file
      # missing from the wheel (e.g. the shared-data templates) fails here
      # instead of after a release.
      - name: Install the wheel
        run: python -m pip install dist/*.whl

      - name: Smoke test the installed package
        run: |
          python - <<'EOF'
          import sys
          from importlib.metadata import entry_points
          from pathlib import Path

          import e2x_course_hub_kubespawner

          (ep,) = entry_points(
              group="e2x_course_hub.infrastructure_catalog_providers", name="k8s_catalog"
          )
          print("Loaded entry point:", ep.load())

          templates = Path(sys.prefix) / "share" / "e2x_course_hub_kubespawner" / "templates"
          for name in ("jupyterhub/spawn.html", "kubespawner/form.html"):
              assert (templates / name).is_file(), f"missing shared template: {name}"
          EOF

      - name: Upload distributions
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
